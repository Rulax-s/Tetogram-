name: Tetogram Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew*'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - 'buildSrc/**'
      - 'TMessagesProj*/**'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'gradle/**'
      - '**/*.gradle*'
      - 'gradle.properties'
      - '.gitmodules'
      - 'buildSrc/**'
      - 'TMessagesProj*/**'

permissions:
  contents: read

concurrency:
  group: tetogram-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Tetogram source invariants
        run: |
          python3 scripts/check-project.py
          python3 scripts/check-localization.py
          python3 scripts/check-settings-insets.py

  build:
    needs: source-checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
      SAFETYNET_KEY: ${{ secrets.SAFETYNET_KEY }}
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare owner configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build-logs
          set -o pipefail
          python3 scripts/prepare-ci.py 2>&1 | tee build-logs/configuration.log
      - name: Checkout pinned submodules recursively
        run: |
          set -o pipefail
          git submodule sync --recursive
          for attempt in 1 2 3; do
            if git submodule update --init --recursive --depth 1 --jobs 2 2>&1 | tee -a build-logs/submodules.log; then
              python3 scripts/check-project.py --submodules 2>&1 | tee -a build-logs/submodules.log
              exit 0
            fi
          done
          exit 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-home-cache-includes: |
            caches/modules-2
            wrapper/dists
          # Cache downloaded dependencies only; never generated project API fields.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Verify wrapper and actual Gradle tasks
        run: |
          set -o pipefail
          chmod +x gradlew
          sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' --max-workers=2 \
            :TMessagesProj_App:tasks --all 2>&1 | tee build-logs/tasks.log
          grep -Eq '^assembleAfatDebug([[:space:]]|$)' build-logs/tasks.log
      - name: Test local history privacy policy
        run: |
          set -o pipefail
          python3 scripts/test-history-storage.py 2>&1 | tee build-logs/history-storage-tests.log
          python3 scripts/test-local-replies.py 2>&1 | tee build-logs/local-reply-storage-tests.log
          ./gradlew --no-daemon --no-build-cache --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' --max-workers=2 \
            :TMessagesProj:testDebugUnitTest --stacktrace 2>&1 | tee build-logs/history-policy-tests.log
      - name: Build ARM64 debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' --max-workers=2 \
            :TMessagesProj_App:assembleAfatDebug --stacktrace 2>&1 | tee build-logs/build.log
      - name: Verify APK identity, signature and native libraries
        run: |
          set -o pipefail
          python3 scripts/verify-apk.py TMessagesProj_App/build/outputs/apk/afat/debug/Tetogram-debug.apk \
            2>&1 | tee build-logs/apk-verification.log
          python3 scripts/check-localization.py TMessagesProj_App/build/outputs/apk/afat/debug/Tetogram-debug.apk \
            2>&1 | tee build-logs/localization-verification.log
          mkdir -p artifacts
          cp TMessagesProj_App/build/outputs/apk/afat/debug/Tetogram-debug.apk artifacts/Tetogram-debug.apk
          sha256sum artifacts/Tetogram-debug.apk > artifacts/Tetogram-debug.apk.sha256
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v7
        with:
          name: Tetogram-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tetogram-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14
